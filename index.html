    <script>
      // Suppress benign HMR WebSocket disconnect messages in container preview
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          e.reason.message?.includes('WebSocket closed') ||
          e.reason.message?.includes('failed to connect to websocket') ||
          String(e.reason).includes('WebSocket')
        )) {
          e.preventDefault();
        }
      });
    </script>
