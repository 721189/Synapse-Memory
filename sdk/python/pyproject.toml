[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-memory"
version = "0.1.0"
authors = [{name = "Synapse Cognitive Systems", email = "singhshivam20009@gmail.com"}]
description = "Production-grade active RAG & cognitive memory engine with multi-tenancy, pgvector HNSW indexing, semantic deduplication, decay-based pruning, and token-aware context packing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
    "cryptography>=3.4.0",
    "requests>=2.25.0",
    "numpy>=1.20.0"
]

[project.urls]
"Homepage" = "https://github.com/721189/Synapse-Memory"
"Bug Tracker" = "https://github.com/721189/Synapse-Memory/issues"
"Documentation" = "https://github.com/721189/Synapse-Memory#readme"
"Repository" = "https://github.com/721189/Synapse-Memory.git"

[project.optional-dependencies]
local-models = [
    "sentence-transformers>=2.2.0"
]
pgvector = [
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0"
]
langchain = [
    "langchain-core>=0.1.0"
]
llamaindex = [
    "llama-index-core>=0.10.0"
]
all = [
    "sentence-transformers>=2.2.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0"
]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pytest>=7.0.0",
    "types-cryptography",
    "types-requests"
]

[project.scripts]
synapse-memory = "synapse_memory.cli.synapse_cli:main"
synapse = "synapse_memory.cli.synapse_cli:main"
synapse-cli = "synapse_memory.cli.synapse_cli:main"

[tool.setuptools.packages.find]
where = ["."]
