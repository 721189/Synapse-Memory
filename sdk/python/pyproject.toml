[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Published as `synapse-memory-engine` on PyPI — the `synapse-memory` name is
# owned by an unrelated third-party project. Import package stays `synapse_memory`.
# See docs/publishing.md.
name = "synapse-memory-engine"
version = "1.3.1"
authors = [{name = "Synapse Cognitive Systems", email = "singhshivam20009@gmail.com"}]
description = "Production-grade active RAG & cognitive memory engine with multi-tenancy, pgvector HNSW indexing, semantic deduplication, decay-based pruning, and token-aware context packing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    # Direct floor for the HTTP dependency graph: the resolver otherwise picks
    # urllib3 2.7.x, which the image scan flags (CVE-2026-97687 / CVE-2026-97689).
    "urllib3>=2.8.0"
]

[project.urls]
"Homepage" = "https://github.com/721189/Synapse-Memory"
"Bug Tracker" = "https://github.com/721189/Synapse-Memory/issues"
"Documentation" = "https://github.com/721189/Synapse-Memory#readme"
"Repository" = "https://github.com/721189/Synapse-Memory.git"

[project.optional-dependencies]
local-models = [
    "sentence-transformers>=5.0.0"
]
pgvector = [
    "psycopg2-binary>=2.9.9.1",
    "pgvector>=0.4.0"
]
redis = [
    "redis>=5.0.0"
]
langchain = [
    "langchain-core>=0.3.0"
]
llamaindex = [
    "llama-index-core>=0.13.0"
]
all = [
    "sentence-transformers>=5.0.0",
    "psycopg2-binary>=2.9.9.1",
    "pgvector>=0.4.0",
    "langchain-core>=0.3.0",
    "llama-index-core>=0.13.0",
    "redis>=5.0.0"
]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pytest>=8.0.0",
    # Required by fastapi.testclient.TestClient -> starlette.testclient
    "httpx>=0.27.0",
    # NOTE: types-cryptography is intentionally absent. Its last release is
    # 3.3.23.x, so any `types-cryptography>=42` pin is unsatisfiable; cryptography
    # itself ships inline types (py.typed) since 3.4, and this project requires
    # >=42, so mypy reads the real annotations from the package.
    "types-requests>=2.32.0"
]

[project.scripts]
synapse-memory = "synapse_memory.cli.synapse_cli:main"
synapse = "synapse_memory.cli.synapse_cli:main"
synapse-cli = "synapse_memory.cli.synapse_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synapse_memory*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type checkers use our annotations.
synapse_memory = ["py.typed"]
