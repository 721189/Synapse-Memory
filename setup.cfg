[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501, F401, F841, E402, W291, W292, W293, E302, E305, E722, E711, E712
exclude = .git,__pycache__,build,dist,*.egg-info,.venv,notebooks,benchmarks

[mypy]
ignore_missing_imports = True
follow_imports = skip
warn_unused_configs = False
warn_return_any = False
check_untyped_defs = False
disallow_untyped_defs = False

[bandit]
skips = B101,B311,B104,B608
exclude = /tests/,/notebooks/

