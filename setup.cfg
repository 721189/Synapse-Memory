[flake8]
max-line-length = 140
extend-ignore = E203, W503, E501, F401, F841, E402, W291, W292, W293, E302, E305, E722, E711, E712, E111, E117, E704, E301, E303, E306, W391, E261, E262, E265
exclude = .git,__pycache__,build,dist,*.egg-info,.venv,notebooks,benchmarks,tests

[mypy]
ignore_missing_imports = True
follow_imports = skip
warn_unused_configs = False
warn_return_any = False
check_untyped_defs = False
disallow_untyped_defs = False
disable_error_code = import-untyped, import-not-found, name-defined

[bandit]
skips = B101,B311,B104,B608,B105,B106,B107,B110,B404,B603,B607
exclude = /tests/,/notebooks/,/dist/,/build/

