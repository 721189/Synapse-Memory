name: Publish Python SDK to PyPI

# Build and verify the SDK on manual runs. Publish only from a v* tag that
# points exactly to the current main commit and whose main-branch CI is green.
# Publishing uses PyPI trusted publishing (GitHub OIDC); no long-lived token.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: pypi

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install build tooling and SDK with test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Test SDK
        env:
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests -q

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist sdk/python

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG_VER"
          test "$TAG" = "$PKG_VER"

      - name: Require tag to equal main and main CI to be green
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "tag=$TAG_SHA main=$MAIN_SHA"
          test -n "$MAIN_SHA"
          test "$TAG_SHA" = "$MAIN_SHA" || {
            echo "::error::Refusing release: tag must point to the exact current main commit."
            exit 1
          }
          CI_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50")"
          GREEN_RUNS="$(printf '%s' "$CI_JSON" | jq --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
          echo "successful_main_CI_runs_for_tagged_sha=$GREEN_RUNS"
          test "$GREEN_RUNS" -gt 0 || {
            echo "::error::Refusing release: no successful main CI run exists for the exact tagged commit."
            exit 1
          }

      - name: Verify fresh-environment wheel installation
        run: |
          python -m venv /tmp/fresh-env
          /tmp/fresh-env/bin/python -m pip install --quiet dist/*.whl
          /tmp/fresh-env/bin/python - <<'PY'
          import importlib.metadata as md
          import synapse_memory

          dist_name = "synapse-memory-engine"
          installed = md.version(dist_name)
          assert installed == synapse_memory.__version__, (
              f"metadata version {installed} != __version__ {synapse_memory.__version__}"
          )
          origin = md.distribution(dist_name).locate_file("")
          print(f"fresh install OK: {dist_name}=={installed} (import synapse_memory from {origin})")
          PY

      - name: Publish to PyPI using trusted publishing
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
