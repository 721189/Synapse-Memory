name: Publish Python SDK to PyPI

# Builds the SDK distribution from sdk/python, gates it on the unit suite,
# verifies the wheel installs into a FRESH virtualenv (this is the
# "a fresh environment can install the right project" guarantee), then
# publishes to PyPI as `synapse-memory-engine` via OIDC trusted publishing.
#
# Tag pushes (v*) additionally check tag == package version and actually
# upload; workflow_dispatch runs the same pipeline as a dry run (no upload).
#
# One-time setup (see docs/publishing.md):
#   1. PyPI: create a PENDING TRUSTED PUBLISHER for project `synapse-memory-engine`
#      bound to repo 721189/Synapse-Memory, workflow publish-pypi.yml, env `pypi`.
#   2. GitHub: create the `pypi` environment (optional required reviewers).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    # OIDC token is minted for this job only; no long-lived PyPI credentials anywhere.
    permissions:
      contents: read
      id-token: write
    environment: pypi

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (libpq for psycopg2/pgvector)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install build tooling and the SDK (dev gate)
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Gate — unit test suite must be green
        env:
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests -q

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist sdk/python

      - name: Metadata check (twine)
        run: python -m twine check --strict dist/*

      - name: "Tag must match package version"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import pathlib,re; t=pathlib.Path('sdk/python/pyproject.toml').read_text(); print(re.search(r'^version = \"(.+)\"', t, re.M).group(1))")
          echo "tag=$TAG package=$PKG_VER"
          test "$TAG" = "$PKG_VER"

      - name: Fresh-environment install verification
        run: |
          python -m venv /tmp/fresh-env
          /tmp/fresh-env/bin/python -m pip install --quiet dist/*.whl
          /tmp/fresh-env/bin/python - <<'PY'
          import importlib.metadata as md
          import synapse_memory

          dist_name = "synapse-memory-engine"
          installed = md.version(dist_name)
          assert installed == synapse_memory.__version__, (
              f"metadata version {installed} != __version__ {synapse_memory.__version__}"
          )
          # The import package must NOT collide with the unrelated PyPI project
          # `synapse-memory` — prove the installed dist owns the import.
          origin = md.distribution(dist_name).locate_file("")
          print(f"fresh install OK: {dist_name}=={installed} (import synapse_memory from {origin})")
          PY

      - name: Publish to PyPI (trusted publishing, no tokens)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
