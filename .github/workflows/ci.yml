name: Synapse CI/CD Matrix Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix-tests:
    name: Python ${{ matrix.python-version }} Engine Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e "sdk/python[all,dev]"

      - name: Verify Clean Module Imports
        env:
          PYTHONPATH: sdk/python
        run: |
          python -c "import synapse_memory; from synapse_memory.core import SQLiteMemoryStore, PGVectorMemoryStore, SynapseEmbedder, HybridSearch, KnapsackPacker, DecayEngine, SecurityManager; print('SynapseMemory all core engines cleanly imported!')"

      - name: Code Style & Quality (flake8)
        run: |
          flake8 sdk/python/synapse_memory --config=setup.cfg

      - name: Static Type Analysis (mypy)
        run: |
          mypy sdk/python/synapse_memory --config-file setup.cfg

      - name: Security Vulnerability Scan (bandit)
        run: |
          bandit -r sdk/python/synapse_memory -s B101,B104,B311,B608

      - name: Execute Full Unit & Integration Test Suite
        env:
          PYTHONPATH: sdk/python
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: |
          pytest sdk/python/tests -v

  frontend-build:
    name: Node.js Frontend & Gateway Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build

  container-build:
    name: Docker Container Image Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          docker build -t synapse-memory:ci-test .

  python-pgvector-integration-tests:
    name: Python PGVector Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse_test
          POSTGRES_PASSWORD: synapse_test
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e "sdk/python[all,dev]"

      - name: Run PGVector Integration Tests
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
        run: |
          pytest sdk/python/tests/test_pgvector_integration.py -v
