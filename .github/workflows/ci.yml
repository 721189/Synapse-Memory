name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install -r sdk/python/requirements.txt
        pip install -r requirements-dev.txt
        pip install -e sdk/python
        pip install flake8 bandit mypy pytest
    - name: Lint with flake8
      run: flake8 sdk/python
    - name: Security audit with bandit
      run: bandit -r sdk/python -s B101,B104,B311
    - name: Type-check with mypy
      run: mypy sdk/python --config-file setup.cfg
    - name: Test with pytest
      env:
        SYNAPSE_ENCRYPTION_KEY: "c3luYXBzZS1lbmNyeXB0aW9uLWtleS1kZW1vLTEyMzQ1Ng=="
      run: pytest sdk/python

