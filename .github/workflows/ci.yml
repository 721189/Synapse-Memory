name: Synapse CI/CD Matrix Pipeline

on:
  push:
    branches: [main, master, develop, 'production-*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-type:
    name: Python ${{ matrix.python-version }} Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package (lean, no heavy ML)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Verify Clean Module Imports
        env:
          PYTHONPATH: sdk/python
        run: |
          python -c "import synapse_memory; from synapse_memory.core import SQLiteMemoryStore, PGVectorMemoryStore, SynapseEmbedder, HybridSearch, KnapsackPacker, DecayEngine, SecurityManager; print('All core engines imported OK')"

      - name: Code Style (flake8)
        run: flake8 sdk/python/synapse_memory scripts --config=setup.cfg

      - name: Static Type Analysis (mypy)
        run: mypy sdk/python/synapse_memory --config-file setup.cfg

      - name: Security Scan (bandit)
        run: bandit -r sdk/python/synapse_memory scripts -s B101,B104,B105,B110,B310,B311,B608

  python-tests:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package (lean, no heavy ML)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Execute Full Test Suite
        env:
          PYTHONPATH: sdk/python
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests -v

  frontend-build:
    name: Node.js Frontend & Gateway Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build

  container-build:
    name: Docker Container Image Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker Container
        run: docker build -t synapse-memory:ci-test .

  python-pgvector-integration-tests:
    name: Python PGVector Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse_test
          POSTGRES_PASSWORD: synapse_test
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,dev]"

      - name: Create isolated database for 3072-dimensional pgvector test
        env:
          PGPASSWORD: synapse_test
        run: |
          createdb -h localhost -U synapse_test synapse_test_3072
          psql -h localhost -U synapse_test -d synapse_test_3072 -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Verify 3072-dimensional halfvec HNSW path with synthetic data
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test_3072
          SYNAPSE_LIVE_PGVECTOR_3072: "1"
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests/test_f18_pgvector_3072.py -v

      - name: Provision least-privilege roles (P0-5)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app \
            --admin-role synapse_admin \
            --runtime-password synapse_app_ci \
            --admin-password synapse_admin_ci

      - name: Install required extensions (DBA step, as superuser)
        env:
          PGPASSWORD: synapse_test
        run: |
          psql -h localhost -U synapse_test -d synapse_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Migrate schema as the admin role (migrate-then-run topology)
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_admin:synapse_admin_ci@localhost:5432/synapse_test
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
        run: |
          python -c "from synapse_memory.core.pgvector_db import PGVectorMemoryStore; s = PGVectorMemoryStore(connection_string='$DATABASE_URL', dimension=384, fail_closed=True); print('schema provisioned; connected =', s.is_connected)"
          # The auth schema is created by SecurityManager, not by the memories
          # migrations. The engine runs with SYNAPSE_APPLY_DB_SCHEMA=false and
          # only validates it, so it must be created here as the admin role or
          # startup fails closed with "Auth table 'public.api_keys' is missing".
          python -c "from synapse_memory.core.auth import SecurityManager; SecurityManager(connection_string='$DATABASE_URL', fail_closed=True); print('auth schema provisioned')"

      - name: Re-run provisioning to grant DML on the created tables (idempotency check)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app \
            --admin-role synapse_admin \
            --runtime-password synapse_app_ci \
            --admin-password synapse_admin_ci

      - name: Verify runtime-role invariant (fails the build if broken)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app --admin-role synapse_admin --verify-only

      - name: Run PGVector Integration Tests
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_admin:synapse_admin_ci@localhost:5432/synapse_test
          SYNAPSE_APP_DATABASE_URL: postgresql://synapse_app:synapse_app_ci@localhost:5432/synapse_test
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
        run: pytest sdk/python/tests/test_pgvector_integration.py -v

      - name: Production topology /readiness smoke (migrate-then-run, DML-only runtime role)
        env:
          PYTHONPATH: sdk/python
          # Runtime role DSN: schema was migrated by synapse_admin above; the
          # engine must boot with DDL disabled and prove /readiness READY.
          DATABASE_URL: postgresql://synapse_app:synapse_app_ci@localhost:5432/synapse_test
          SYNAPSE_APPLY_DB_SCHEMA: "false"
          SYNAPSE_ALLOW_DB_FALLBACK: "false"
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
          NODE_ENV: production
          # This is a wiring/readiness smoke, not a semantic retrieval benchmark.
          # Match the pre-migrated 384-d schema with a deterministic test embedder;
          # the separate production-startup guard verifies it is refused without opt-in.
          SYNAPSE_EMBEDDING_PROVIDER: deterministic
          SYNAPSE_EMBEDDING_DIMENSION: "384"
          SYNAPSE_ALLOW_DETERMINISTIC_EMBEDDING: "true"
        run: |
          python -m uvicorn synapse_memory.api.fastapi_server:app --host 127.0.0.1 --port 8009 &
          ENGINE_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8009/readiness; then
              echo
              echo "/readiness READY under production topology"
              ok=1
              break
            fi
            sleep 2
          done
          kill "$ENGINE_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "/readiness never became READY under the production (migrate-then-run) topology"
            exit 1
          fi

  split-image-build:
    name: Split Docker Images + Compose Smoke
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build engine image
        run: docker build -f Dockerfile.engine -t synapse-engine:ci .

      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t synapse-gateway:ci .

      - name: Validate compose config
        env:
          SYNAPSE_API_KEY: ci-dummy-key
          SYNAPSE_ENCRYPTION_KEY: 2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0=
          POSTGRES_PASSWORD: ci-dummy-postgres
          SYNAPSE_ADMIN_DB_PASSWORD: ci-dummy-admin-password
          SYNAPSE_APP_DB_PASSWORD: ci-dummy-app-password
          SYNAPSE_EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder
        run: docker compose -f deploy/docker-compose.yml config

      - name: Scan engine image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: synapse-engine:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Gate on vulnerabilities that have a FIX available. Debian bookworm
          # base packages are regularly published as "affected" with no fixed
          # version; failing on those blocks the build with nothing the project
          # can do. Unfixed findings stay in the scan output.
          ignore-unfixed: 'true'
          # pip's VENDORED dependencies are build tooling, not application
          # code: they are pinned by the pip wheel itself (urllib3 2.7.0 inside
          # pip/_vendor) and cannot be moved by any constraint in pyproject.toml.
          # The application's own urllib3 floor is enforced in sdk/python.
          skip-dirs: 'usr/local/lib/python3.11/site-packages/pip/_vendor'

      - name: Scan gateway image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: synapse-gateway:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

  helm-validate:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint deploy/helm-chart

      - name: Render manifests
        run: helm template synapse deploy/helm-chart --values deploy/helm-chart/values.yaml

      - name: Validate rendered manifests parse
        run: helm template synapse deploy/helm-chart | python3 -c "import sys,yaml; list(yaml.safe_load_all(sys.stdin)); print('manifests parse OK')"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@31d730383da3a2a71735410240ab9416f8f0eb54
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: All artifacts must advertise the same version
        run: python scripts/check_version_consistency.py

  production-startup:
    name: Production Startup Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.16.3
      - name: Install (lean)
        run: pip install -e "sdk/python[pgvector,dev]"
      - name: Engine must refuse deterministic embeddings in production
        run: |
          if NODE_ENV=production SYNAPSE_EMBEDDING_PROVIDER=deterministic \
             python -c "from synapse_memory.core.embedder import SynapseEmbedder; SynapseEmbedder()"; then
            echo "::error::Engine started with the deterministic (non-semantic) provider under NODE_ENV=production"
            exit 1
          fi
          echo "OK: production refuses the deterministic provider"
      - name: Compose must resolve a semantic provider
        working-directory: deploy
        env:
          SYNAPSE_API_KEY: ci-placeholder
          SYNAPSE_ENCRYPTION_KEY: ci-placeholder
          SYNAPSE_APP_DB_PASSWORD: ci-placeholder
          SYNAPSE_ADMIN_DB_PASSWORD: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          SYNAPSE_EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder
        run: |
          rendered=$(docker compose config)
          echo "$rendered" | grep -q 'SYNAPSE_EMBEDDING_PROVIDER: gemini' \
            || { echo "::error::Compose does not set a semantic embedding provider"; exit 1; }
          echo "$rendered" | grep -Eq 'SYNAPSE_EMBEDDING_PROVIDER: (deterministic|hash|local)$' \
            && { echo "::error::Compose resolves the non-semantic provider"; exit 1; } || true
          echo "OK: compose resolves gemini"
      - name: Helm must refuse deterministic embeddings in production
        run: |
          cd deploy/helm-chart
          if helm template t . --set config.embeddingProvider=deterministic >/dev/null 2>&1; then
            echo "::error::Helm rendered a production release with deterministic embeddings"
            exit 1
          fi
          helm template t . >/dev/null
          echo "OK: helm refuses deterministic, renders with the default provider"

  deployment-smoke:
    name: Deployment Smoke (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Boot the real stack, verify auth write/read, tear down
        run: python3 scripts/deploy_smoke.py
