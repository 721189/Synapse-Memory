name: Synapse CI/CD Matrix Pipeline

on:
  push:
    branches: [main, master, develop, 'production-*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-type:
    name: Python ${{ matrix.python-version }} Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package (lean, no heavy ML)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Verify Clean Module Imports
        env:
          PYTHONPATH: sdk/python
        run: |
          python -c "import synapse_memory; from synapse_memory.core import SQLiteMemoryStore, PGVectorMemoryStore, SynapseEmbedder, HybridSearch, KnapsackPacker, DecayEngine, SecurityManager; print('All core engines imported OK')"

      - name: Code Style (flake8)
        run: flake8 sdk/python/synapse_memory scripts --config=setup.cfg

      - name: Static Type Analysis (mypy)
        run: mypy sdk/python/synapse_memory --config-file setup.cfg

      - name: Security Scan (bandit)
        run: bandit -r sdk/python/synapse_memory scripts -s B101,B104,B105,B110,B310,B311,B608

  python-tests:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package (lean, no heavy ML)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,langchain,llamaindex,dev]"

      - name: Execute Full Test Suite
        env:
          PYTHONPATH: sdk/python
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests -v

  frontend-build:
    name: Node.js Frontend & Gateway Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build

  container-build:
    name: Docker Container Image Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker Container
        run: docker build -t synapse-memory:ci-test .

  python-pgvector-integration-tests:
    name: Python PGVector Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse_test
          POSTGRES_PASSWORD: synapse_test
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "sdk/python[pgvector,dev]"

      - name: Create isolated database for 3072-dimensional pgvector test
        env:
          PGPASSWORD: synapse_test
        run: |
          createdb -h localhost -U synapse_test synapse_test_3072
          psql -h localhost -U synapse_test -d synapse_test_3072 -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Verify 3072-dimensional halfvec HNSW path with synthetic data
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test_3072
          SYNAPSE_LIVE_PGVECTOR_3072: "1"
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
        run: pytest sdk/python/tests/test_f18_pgvector_3072.py -v

      - name: Provision least-privilege roles (P0-5)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app \
            --admin-role synapse_admin \
            --runtime-password synapse_app_ci \
            --admin-password synapse_admin_ci

      - name: Install required extensions (DBA step, as superuser)
        env:
          PGPASSWORD: synapse_test
        run: |
          psql -h localhost -U synapse_test -d synapse_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Migrate schema as the admin role (migrate-then-run topology)
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_admin:synapse_admin_ci@localhost:5432/synapse_test
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
        run: |
          python -c "from synapse_memory.core.pgvector_db import PGVectorMemoryStore; s = PGVectorMemoryStore(connection_string='$DATABASE_URL', dimension=384, fail_closed=True); print('schema provisioned; connected =', s.is_connected)"
          # The auth schema is created by SecurityManager, not by the memories
          # migrations. The engine runs with SYNAPSE_APPLY_DB_SCHEMA=false and
          # only validates it, so it must be created here as the admin role or
          # startup fails closed with "Auth table 'public.api_keys' is missing".
          python -c "from synapse_memory.core.auth import SecurityManager; SecurityManager(connection_string='$DATABASE_URL', fail_closed=True); print('auth schema provisioned')"

      - name: Re-run provisioning to grant DML on the created tables (idempotency check)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app \
            --admin-role synapse_admin \
            --runtime-password synapse_app_ci \
            --admin-password synapse_admin_ci

      - name: Verify runtime-role invariant (fails the build if broken)
        env:
          DATABASE_URL: postgresql://synapse_test:synapse_test@localhost:5432/synapse_test
        run: |
          python scripts/provision_db_roles.py \
            --runtime-role synapse_app --admin-role synapse_admin --verify-only

      - name: Run PGVector Integration Tests
        env:
          PYTHONPATH: sdk/python
          DATABASE_URL: postgresql://synapse_admin:synapse_admin_ci@localhost:5432/synapse_test
          SYNAPSE_APP_DATABASE_URL: postgresql://synapse_app:synapse_app_ci@localhost:5432/synapse_test
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
        run: pytest sdk/python/tests/test_pgvector_integration.py -v

      - name: Production topology /readiness smoke (migrate-then-run, DML-only runtime role)
        env:
          PYTHONPATH: sdk/python
          # Runtime role DSN: schema was migrated by synapse_admin above; the
          # engine must boot with DDL disabled and prove /readiness READY.
          DATABASE_URL: postgresql://synapse_app:synapse_app_ci@localhost:5432/synapse_test
          SYNAPSE_APPLY_DB_SCHEMA: "false"
          SYNAPSE_ALLOW_DB_FALLBACK: "false"
          SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
          SYNAPSE_API_KEY: "syn_live_ci_test_key"
          NODE_ENV: production
          # This is a wiring/readiness smoke, not a semantic retrieval benchmark.
          # Match the pre-migrated 384-d schema with a deterministic test embedder;
          # the separate production-startup guard verifies it is refused without opt-in.
          SYNAPSE_EMBEDDING_PROVIDER: deterministic
          SYNAPSE_EMBEDDING_DIMENSION: "384"
          SYNAPSE_ALLOW_DETERMINISTIC_EMBEDDING: "true"
        run: |
          python -m uvicorn synapse_memory.api.fastapi_server:app --host 127.0.0.1 --port 8009 &
          ENGINE_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8009/readiness; then
              echo
              echo "/readiness READY under production topology"
              ok=1
              break
            fi
            sleep 2
          done
          kill "$ENGINE_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "/readiness never became READY under the production (migrate-then-run) topology"
            exit 1
          fi

  split-image-build:
    name: Split Docker Images + Compose Smoke
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build engine image
        run: docker build -f Dockerfile.engine -t synapse-engine:ci .

      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t synapse-gateway:ci .

      - name: Validate compose config
        env:
          SYNAPSE_API_KEY: ci-dummy-key
          SYNAPSE_ENCRYPTION_KEY: 2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0=
          POSTGRES_PASSWORD: ci-dummy-postgres
          SYNAPSE_ADMIN_DB_PASSWORD: ci-dummy-admin-password
          SYNAPSE_APP_DB_PASSWORD: ci-dummy-app-password
          SYNAPSE_EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder
        run: docker compose -f deploy/docker-compose.yml config

      - name: Scan engine image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: synapse-engine:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Gate on vulnerabilities that have a FIX available. Debian bookworm
          # base packages are regularly published as "affected" with no fixed
          # version; failing on those blocks the build with nothing the project
          # can do. Unfixed findings stay in the scan output.
          ignore-unfixed: 'true'
          # pip's VENDORED dependencies are build tooling, not application
          # code: they are pinned by the pip wheel itself (urllib3 2.7.0 inside
          # pip/_vendor) and cannot be moved by any constraint in pyproject.toml.
          # The application's own urllib3 floor is enforced in sdk/python.
          skip-dirs: 'usr/local/lib/python3.11/site-packages/pip/_vendor'

      - name: Scan gateway image
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: synapse-gateway:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

  helm-validate:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint deploy/helm-chart

      - name: Render manifests
        run: helm template synapse deploy/helm-chart --values deploy/helm-chart/values.yaml

      - name: Validate rendered manifests parse
        run: helm template synapse deploy/helm-chart | python3 -c "import sys,yaml; list(yaml.safe_load_all(sys.stdin)); print('manifests parse OK')"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@31d730383da3a2a71735410240ab9416f8f0eb54
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: SDK and deployment versions must each be consistent
        run: python scripts/check_version_consistency.py

  production-startup:
    name: Production Startup Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.16.3
      - name: Install (lean)
        run: pip install -e "sdk/python[pgvector,dev]"
      - name: Engine must refuse deterministic embeddings in production
        run: |
          if NODE_ENV=production SYNAPSE_EMBEDDING_PROVIDER=deterministic \
             python -c "from synapse_memory.core.embedder import SynapseEmbedder; SynapseEmbedder()"; then
            echo "::error::Engine started with the deterministic (non-semantic) provider under NODE_ENV=production"
            exit 1
          fi
          echo "OK: production refuses the deterministic provider"
      - name: Compose must resolve a semantic provider
        working-directory: deploy
        env:
          SYNAPSE_API_KEY: ci-placeholder
          SYNAPSE_ENCRYPTION_KEY: ci-placeholder
          SYNAPSE_APP_DB_PASSWORD: ci-placeholder
          SYNAPSE_ADMIN_DB_PASSWORD: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          SYNAPSE_EMBEDDING_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder
        run: |
          rendered=$(docker compose config)
          echo "$rendered" | grep -q 'SYNAPSE_EMBEDDING_PROVIDER: gemini' \
            || { echo "::error::Compose does not set a semantic embedding provider"; exit 1; }
          echo "$rendered" | grep -Eq 'SYNAPSE_EMBEDDING_PROVIDER: (deterministic|hash|local)$' \
            && { echo "::error::Compose resolves the non-semantic provider"; exit 1; } || true
          echo "OK: compose resolves gemini"
      - name: Helm must refuse deterministic embeddings in production
        run: |
          cd deploy/helm-chart
          if helm template t . --set config.embeddingProvider=deterministic >/dev/null 2>&1; then
            echo "::error::Helm rendered a production release with deterministic embeddings"
            exit 1
          fi
          helm template t . >/dev/null
          echo "OK: helm refuses deterministic, renders with the default provider"

  deployment-smoke:
    name: Deployment Smoke (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Boot the real stack, verify auth write/read, tear down
        run: python3 scripts/deploy_smoke.py

  agent-reliability-fault-injection:
    name: Deterministic Agent Reliability Fault Injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNAPSE_ENCRYPTION_KEY: "2N53Wk7u2V5bK1wU_1F5Y9mZ7zN53Wk7u2V5bK1wU_0="
      SYNAPSE_API_KEY: "syn_live_ci_test_key"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e sdk/python
          python -m pip install "httpx==0.28.1" "httpx2==2.14.0"

      - name: Run deterministic fault-injection suite and write report
        env:
          PYTHONPATH: sdk/python
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from synapse_memory.fault_injection_report import build_fault_injection_report

          report = build_fault_injection_report()
          output = Path("artifacts/agent-reliability-fault-injection.json")
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + chr(10))
          print(json.dumps(report["summary"], sort_keys=True))
          if report["diagnostics"]["failed_scenarios"]:
              print(json.dumps(report["diagnostics"]["failed_scenarios"], indent=2, sort_keys=True))
          if not report["summary"]["all_passed"]:
              raise SystemExit(1)
          PY

      - name: Validate machine-readable report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/agent-reliability-fault-injection.json").read_text()
          )
          assert report["report_schema_version"] == 1
          assert report["fixture"]["scenario_count"] == 10
          assert report["summary"]["all_passed"] is True
          assert report["summary"]["failed"] == 0
          assert report["metrics"]["instrumentation"]["event_delivery_failures"] == 0
          PY

      - name: Upload deterministic fault-injection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-reliability-fault-injection-${{ github.sha }}
          path: artifacts/agent-reliability-fault-injection.json
          if-no-files-found: error
          retention-days: 30

  retrieval-benchmark:
    name: Reproducible Retrieval Benchmark (measured)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e sdk/python

      - name: Run fixed retrieval baseline
        run: |
          python sdk/python/benchmark/retrieval_baselines.py \
            --dataset sdk/python/benchmark/retrieval_dataset.json \
            --output retrieval-baseline-results.json \
            --repeats 5 \
            --warmups 1 \
            --top-k 5 \
            --candidate-k 10 \
            --token-budget 90

      - name: Run paraphrase-heavy multi-fact packing stress fixture
        run: |
          python sdk/python/benchmark/retrieval_baselines.py \
            --dataset sdk/python/benchmark/packing_stress_dataset.json \
            --output packing-stress-results.json \
            --repeats 5 \
            --warmups 1 \
            --top-k 5 \
            --candidate-k 10 \
            --token-budget 90

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrieval-baselines-${{ github.sha }}
          path: |
            retrieval-baseline-results.json
            packing-stress-results.json
          if-no-files-found: error
          retention-days: 30

  semantic-retrieval-benchmark:
    name: Semantic Retrieval + Packing Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ~/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Cache pinned Hugging Face model files
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-all-minilm-l6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Install Synapse SDK and pinned CPU inference dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e sdk/python
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install -r sdk/python/benchmark/requirements-semantic.txt

      - name: Compare deterministic hashes on the semantic evaluation set
        run: |
          python sdk/python/benchmark/retrieval_baselines.py \
            --dataset sdk/python/benchmark/semantic_packing_eval_dataset.json \
            --output semantic-eval-hash-baseline.json \
            --embedding-provider deterministic \
            --repeats 5 \
            --warmups 1 \
            --top-k 5 \
            --candidate-k 10 \
            --token-budget 90

      - name: Run pinned real semantic embedding evaluation
        run: |
          python sdk/python/benchmark/retrieval_baselines.py \
            --dataset sdk/python/benchmark/semantic_packing_eval_dataset.json \
            --output semantic-eval-neural.json \
            --embedding-provider sentence-transformers \
            --model-name sentence-transformers/all-MiniLM-L6-v2 \
            --model-revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --repeats 5 \
            --warmups 1 \
            --top-k 5 \
            --candidate-k 10 \
            --token-budget 90

      - name: Validate semantic model identity and same-input comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("semantic-eval-hash-baseline.json").read_text())
          neural = json.loads(Path("semantic-eval-neural.json").read_text())
          expected_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert baseline["dataset"]["sha256"] == neural["dataset"]["sha256"]
          assert baseline["dataset"]["document_count"] == 96
          assert baseline["dataset"]["query_count"] == 24
          assert len(baseline["dataset"]["queries"]) == len(neural["dataset"]["queries"]) == 24
          assert baseline["environment"]["embedding_is_semantic"] is False
          assert baseline["environment"]["embedding_model"] is None
          assert baseline["environment"]["embedding_model_revision"] is None
          assert neural["environment"]["embedding_is_semantic"] is True, (
              "Neural run did not load a real semantic model."
          )
          assert neural["environment"]["embedding_provider"] == "sentence-transformers"
          assert neural["environment"]["embedding_model"] == "sentence-transformers/all-MiniLM-L6-v2"
          assert neural["environment"]["embedding_model_revision"] == expected_revision
          assert neural["environment"]["embedding_dimension"] == 384
          assert neural["environment"]["embedding_runtime_versions"]["sentence-transformers"] == "6.2.0"
          assert neural["environment"]["embedding_runtime_versions"]["transformers"] == "5.20.2"
          assert neural["environment"]["embedding_runtime_versions"]["torch"] is not None
          for result in (baseline, neural):
              assert set(result["ranking"]) == {"lexical_bm25", "dense_cosine", "hybrid_rrf"}
              assert set(result["context_packing"]) == {
                  "top_k_unbudgeted", "ranked_fit", "greedy_ratio",
                  "knapsack_dp", "rank_discount_dp"
              }
              assert result["tenant_isolation"]["status"] == "passed"
              assert result["deletion"]["status"] == "passed"
              for method in ("ranked_fit", "greedy_ratio", "knapsack_dp", "rank_discount_dp"):
                  assert result["context_packing"][method]["over_budget_query_count"] == 0
          print("Verified identical dataset SHA:", neural["dataset"]["sha256"])
          print("Verified neural model:", neural["environment"]["embedding_model"])
          print("Verified model revision:", neural["environment"]["embedding_model_revision"])
          print("Runtime versions:", neural["environment"]["embedding_runtime_versions"])
          for method in ("lexical_bm25", "dense_cosine", "hybrid_rrf"):
              print(
                  "{0}: hash recall@5={1:.3f}, hash MRR={2:.3f}; "
                  "semantic recall@5={3:.3f}, semantic MRR={4:.3f}".format(
                      method,
                      baseline["ranking"][method]["mean_recall_at_k"],
                      baseline["ranking"][method]["mean_reciprocal_rank"],
                      neural["ranking"][method]["mean_recall_at_k"],
                      neural["ranking"][method]["mean_reciprocal_rank"],
                  )
              )
          for method in ("ranked_fit", "knapsack_dp", "rank_discount_dp"):
              print(
                  "{0}: hash fact recall={1:.3f}; semantic fact recall={2:.3f}; "
                  "semantic candidate recall={3:.3f}; semantic retained-candidate recall={4:.3f}".format(
                      method,
                      baseline["context_packing"][method]["mean_relevant_recall"],
                      neural["context_packing"][method]["mean_relevant_recall"],
                      neural["context_packing"][method]["mean_candidate_recall"],
                      neural["context_packing"][method]["mean_retained_candidate_relevant_recall"],
                  )
              )
          PY

      - name: Generate blinded developer-query relevance review packet
        run: |
          python sdk/python/benchmark/create_blind_developer_review_packet.py \
            --dataset sdk/python/benchmark/semantic_packing_eval_dataset.json \
            --results semantic-eval-hash-baseline.json semantic-eval-neural.json \
            --packet-output developer-relevance-review-packet.json \
            --mapping-output developer-relevance-review-key.json \
            --max-queries 12

      - name: Download and checksum-pin corrected LongMemEval-S data
        id: longmemeval-data
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id="agentscope-ai/ReMe_longmemeval_clean_s_v2",
              filename="longmemeval_s_reme_cleaned.json",
              repo_type="dataset",
              revision="f8bd08fd19ef175c99c7065c322191e16c69f0ea",
          )
          print("path=" + path)
          PY

      - name: Evaluate full LongMemEval-S with reviewed evidence-session labels
        id: longmemeval_eval
        run: |
          python sdk/python/benchmark/evaluate_longmemeval.py \
            --dataset "${{ steps.longmemeval-data.outputs.path }}" \
            --output longmemeval-external-results.json \
            --embedding-provider sentence-transformers \
            --model-name sentence-transformers/all-MiniLM-L6-v2 \
            --model-revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --top-k 5 \
            --candidate-k 10 \
            --token-budget 512

      - name: Validate external benchmark provenance and output
        if: always() && steps.longmemeval_eval.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result_path = Path("longmemeval-external-results.json")
          if not result_path.is_file():
              raise SystemExit("LongMemEval result file is missing because the evaluation step did not complete.")
          result = json.loads(result_path.read_text())
          assert result["source"]["dataset_sha256"] == "57ed3225673015880c42eaf764406e656d9ac3fc4821337e3ec3c28ac8259823"
          assert result["source"]["dataset_revision"] == "f8bd08fd19ef175c99c7065c322191e16c69f0ea"
          assert result["source"]["dataset_card_sha256_mismatch"] is True
          assert result["source"]["question_count"] == 500
          assert result["source"]["positive_evidence_question_count"] > 0
          assert result["source"]["label_validation"].startswith("passed:")
          assert result["environment"]["embedding_is_semantic"] is True
          assert result["environment"]["embedding_model_revision"] == "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert set(result["ranking"]) == {"lexical_bm25", "dense_cosine", "hybrid_rrf"}
          assert len(result["ranking"]["hybrid_rrf"]["per_question_type"]) >= 5
          assert all(v["over_budget_query_count"] == 0 for v in result["context_packing"].values())
          packet = json.loads(Path("developer-relevance-review-packet.json").read_text())
          assert packet["label_status"] == "awaiting_independent_human_review"
          assert packet["review_protocol"]["reviewers_required"] == 2
          assert len(packet["cases"]) > 0
          print("LongMemEval dataset SHA:", result["source"]["dataset_sha256"])
          print("Positive-evidence questions:", result["source"]["positive_evidence_question_count"])
          print("No-evidence questions:", result["source"]["no_evidence_question_count"])
          print("Future sessions excluded:", result["source"]["future_sessions_excluded_before_query_time"])
          for method, metrics in result["ranking"].items():
              print("{0}: Recall@5={1:.3f}, Recall@10={2:.3f}, MRR={3:.3f}, nDCG@10={4:.3f}".format(
                  method, metrics["mean_recall_at_5"], metrics["mean_recall_at_10"],
                  metrics["mean_mrr"], metrics["mean_ndcg_at_10"]
              ))
          print("Developer review cases awaiting two independent reviewers:", len(packet["cases"]))
          PY

      - name: Upload semantic and external benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-packing-evaluation-${{ github.sha }}
          path: |
            semantic-eval-hash-baseline.json
            semantic-eval-neural.json
            longmemeval-external-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload blinded developer relevance review packet
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-relevance-review-packet-${{ github.sha }}
          path: developer-relevance-review-packet.json
          if-no-files-found: ignore
          retention-days: 30

