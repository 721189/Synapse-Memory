name: License and SDK Distribution Check

on:
  pull_request:
    branches: [main]
    paths:
      - "LICENSE"
      - "sdk/python/LICENSE"
      - "sdk/python/**"
      - ".github/workflows/license-metadata.yml"
  push:
    branches: [main]
    paths:
      - "LICENSE"
      - "sdk/python/LICENSE"
      - "sdk/python/**"
      - ".github/workflows/license-metadata.yml"

permissions:
  contents: read

concurrency:
  group: license-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-license-metadata:
    name: Build SDK and verify Apache-2.0 metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel sdk/python --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify Apache expression and license inclusion
        run: |
          python - <<'PY'
          from email import message_from_bytes
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_path = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = message_from_bytes(archive.read(metadata_path))
              expression = metadata.get("License-Expression")
              assert expression == "Apache-2.0", (
                  f"wheel License-Expression must be Apache-2.0, got {expression!r}"
              )
              license_paths = [
                  name for name in names
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert license_paths, "wheel is missing its .dist-info/licenses/LICENSE"
              license_text = archive.read(license_paths[0]).decode("utf-8")
              assert "Apache License" in license_text
              assert "Copyright (c) 2026 Shivam Singh" in license_text

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              license_paths = [name for name in names if name.endswith("/LICENSE")]
              assert license_paths, "source distribution is missing LICENSE"
              license_text = archive.extractfile(license_paths[0]).read().decode("utf-8")
              assert "Apache License" in license_text
              assert "Copyright (c) 2026 Shivam Singh" in license_text

          print("SDK wheel and sdist both carry Apache-2.0 metadata and license text.")
          PY
