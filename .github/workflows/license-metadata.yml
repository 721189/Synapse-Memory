name: License and SDK Distribution Check

on:
  pull_request:
    branches: [main]
    paths:
      - "LICENSE"
      - "sdk/python/LICENSE"
      - "sdk/python/**"
      - "package.json"
      - "package-lock.json"
      - "requirements*.txt"
      - "pyproject.toml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "TRADEMARKS.md"
      - "DCO"
      - "docs/**"
      - ".github/workflows/license-metadata.yml"
  push:
    branches: [main]
    paths:
      - "LICENSE"
      - "sdk/python/LICENSE"
      - "sdk/python/**"
      - ".github/workflows/license-metadata.yml"

permissions:
  contents: read

concurrency:
  group: license-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-license-metadata:
    name: Build SDK and verify Apache-2.0 metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel sdk/python --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify Apache expression and license inclusion
        run: |
          python - <<'PY'
          from email import message_from_bytes
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_path = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = message_from_bytes(archive.read(metadata_path))
              expression = metadata.get("License-Expression")
              assert expression == "Apache-2.0", (
                  f"wheel License-Expression must be Apache-2.0, got {expression!r}"
              )
              license_paths = [
                  name for name in names
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert license_paths, "wheel is missing its .dist-info/licenses/LICENSE"
              license_text = archive.read(license_paths[0]).decode("utf-8")
              assert "Apache License" in license_text
              assert "Copyright (c) 2026 Shivam Singh" in license_text

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              license_paths = [name for name in names if name.endswith("/LICENSE")]
              assert license_paths, "source distribution is missing LICENSE"
              license_text = archive.extractfile(license_paths[0]).read().decode("utf-8")
              assert "Apache License" in license_text
              assert "Copyright (c) 2026 Shivam Singh" in license_text

          print("SDK wheel and sdist both carry Apache-2.0 metadata and license text.")
          PY

  dependency-license-inventory:
    name: Generate resolved dependency license inventories
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve Python runtime and integration dependencies
        run: |
          python -m pip install --upgrade pip pip-licenses
          python -m pip install -e "sdk/python[pgvector,redis,langchain,llamaindex]"
          mkdir -p reports
          pip-licenses --format=json --with-urls --with-license-file \
            > reports/python-third-party-licenses.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Resolve Node dependencies and generate inventory
        run: |
          npm ci
          npx --yes license-checker --json --out reports/node-third-party-licenses.json

      - name: Upload dependency license inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: third-party-license-inventory
          path: reports/*.json
          if-no-files-found: error
          retention-days: 30
