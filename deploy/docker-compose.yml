version: '3.8'

# Production-grade Docker Compose for SynapseMemory Enterprise Cognitive Substrate.
# Runs the cognitive engine and the API gateway as SEPARATE services (split
# images) so each scales, restarts, and is health-checked independently.

services:
  # ── Python cognitive engine (FastAPI + pgvector) ──────────────────────────
  synapse-memory-engine:
    build:
      context: ..
      dockerfile: Dockerfile.engine
    image: synapse-memory/engine:${GATEWAY_VERSION:-v1.2.0}
    container_name: synapse-engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SYNAPSE_API_KEY=${SYNAPSE_API_KEY:?SYNAPSE_API_KEY is required}
      - SYNAPSE_ENCRYPTION_KEY=${SYNAPSE_ENCRYPTION_KEY:?SYNAPSE_ENCRYPTION_KEY is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-synapse_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-pgvector:5432/${POSTGRES_DB:-synapse_cognitive}
      - SYNAPSE_STORAGE_BACKEND=${SYNAPSE_STORAGE_BACKEND:-pgvector}
      - SYNAPSE_SQLITE_DB_PATH=/data/synapse_memory.db
      - SYNAPSE_ALLOW_DB_FALLBACK=${SYNAPSE_ALLOW_DB_FALLBACK:-false}
      - TOKEN_BUDGET_MAX=${TOKEN_BUDGET_MAX:-1500}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-120}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis-state:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - synapse-engine-data:/data
    depends_on:
      postgres-pgvector:
        condition: service_healthy
      redis-state:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/readiness', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synapse-internal

  # ── Node API gateway + React dashboard ─────────────────────────────────────
  synapse-memory-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    image: synapse-memory/gateway:${GATEWAY_VERSION:-v1.2.0}
    container_name: synapse-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHON_ENGINE_URL=http://synapse-memory-engine:8008
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENABLE_DEMO_ROUTES=${ENABLE_DEMO_ROUTES:-false}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-120}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      synapse-memory-engine:
        condition: service_healthy
      postgres-pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synapse-internal

  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: synapse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synapse_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-synapse_cognitive}
    volumes:
      - synapse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse_admin} -d ${POSTGRES_DB:-synapse_cognitive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synapse-internal

  redis-state:
    image: redis:7-alpine
    container_name: synapse-cache
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - synapse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synapse-internal

networks:
  synapse-internal:
    driver: bridge

volumes:
  synapse-db-data:
  synapse-redis-data:
  synapse-engine-data:
