apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse-memory.fullname" . }}-gateway
  labels:
    {{- include "synapse-memory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "synapse-memory.selectorLabels" . | nindent 4 }}
