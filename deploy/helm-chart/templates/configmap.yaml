apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse-memory.fullname" . }}-config
  labels:
    {{- include "synapse-memory.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  TOKEN_BUDGET_MAX: {{ .Values.config.tokenBudgetMax | quote }}
  HYBRID_DECAY_RATE: {{ .Values.config.hybridDecayRate | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  SYNAPSE_DB_ADMIN_ROLE: {{ .Values.config.dbAdminRole | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  # Storage backend for the cognitive engine: pgvector (team/prod) or sqlite (dev)
  SYNAPSE_STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  # NOTE: REDIS_URL intentionally NOT here: envFrom values are passed through
  # literally, without $(VAR) expansion, so a password reference would never
  # resolve. The engine Deployment builds its authenticated REDIS_URL from
  # container-level env (where the kubelet expands $(REDIS_PASSWORD)).
  # DATABASE_URL is built the same way in the engine Deployment.
  # Derived in-cluster engine URL: must match the engine Service name
  # (<fullname>-engine) for ANY release name. A hardcoded hostname silently
  # breaks gateway -> engine routing (e.g. release "synapse" renders
  # "synapse-synapse-memory-engine"). Set config.pythonEngineUrl to override.
  PYTHON_ENGINE_URL: {{ .Values.config.pythonEngineUrl | default (printf "http://%s-engine:%v" (include "synapse-memory.fullname" .) (.Values.config.pythonPort | int)) | quote }}
  PYTHON_PORT: {{ .Values.config.pythonPort | quote }}
  # Fail-closed: never silently fall back to in-memory storage in production.
  SYNAPSE_ALLOW_DB_FALLBACK: "false"
  # NOTE: DATABASE_URL intentionally NOT in the ConfigMap — it contains a
  # secret reference. The engine Deployment builds it from container-level
  # env (where kubelet expands $(DB_PASSWORD) from the Secret). Values
  # injected via envFrom/configMapRef are passed through literally without
  # $(VAR) expansion, so a password reference here would never resolve.
  # Disable demo/simulated routes in production.
  ENABLE_DEMO_ROUTES: {{ .Values.config.enableDemoRoutes | quote }}
  RATE_LIMIT_PER_MIN: {{ .Values.config.rateLimitPerMin | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  SYNAPSE_SQLITE_DB_PATH: {{ .Values.config.sqliteDbPath | quote }}
  # Semantic embedding provider (F-06 / P0 startup). The engine refuses to start
  # with the deterministic hash provider when NODE_ENV=production, so this must
  # name a real model; the guard below fails the render early instead of letting
  # a pod crash-loop.
  {{- if and (eq (toString .Values.config.embeddingProvider) "deterministic") (eq .Values.config.nodeEnv "production") }}
  {{- fail "config.embeddingProvider=deterministic is not allowed with nodeEnv=production; set gemini, openai or sentence-transformers" }}
  {{- end }}
  {{- if not .Values.config.embeddingProvider }}
  {{- fail "config.embeddingProvider is required; set gemini, openai or sentence-transformers" }}
  {{- end }}
  SYNAPSE_EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
