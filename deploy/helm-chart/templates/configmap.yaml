apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse-memory.fullname" . }}-config
  labels:
    {{- include "synapse-memory.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  TOKEN_BUDGET_MAX: {{ .Values.config.tokenBudgetMax | quote }}
  HYBRID_DECAY_RATE: {{ .Values.config.hybridDecayRate | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  REDIS_URL: "redis://{{ .Values.config.redisHost }}:{{ .Values.config.redisPort }}/0"
  # Storage backend for the cognitive engine: pgvector (team/prod) or sqlite (dev)
  SYNAPSE_STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  # DATABASE_URL is built in the engine Deployment's container env (where
  # kubelet expands $(DB_PASSWORD) from the Secret). It must NOT live here:
  # values injected via envFrom are passed through literally, without $(VAR)
  # expansion, so a password reference in a ConfigMap would never resolve.
  PYTHON_ENGINE_URL: {{ .Values.config.pythonEngineUrl | quote }}
  PYTHON_PORT: {{ .Values.config.pythonPort | quote }}
  # Fail-closed: never silently fall back to in-memory storage in production.
  SYNAPSE_ALLOW_DB_FALLBACK: "false"
  # NOTE: DATABASE_URL intentionally NOT in the ConfigMap — it contains a
  # secret reference. The engine Deployment builds it from container-level
  # env (where kubelet expands $(DB_PASSWORD) from the Secret). Values
  # injected via envFrom/configMapRef are passed through literally without
  # $(VAR) expansion, so a password reference here would never resolve.
  # Disable demo/simulated routes in production.
  ENABLE_DEMO_ROUTES: {{ .Values.config.enableDemoRoutes | quote }}
  RATE_LIMIT_PER_MIN: {{ .Values.config.rateLimitPerMin | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  SYNAPSE_SQLITE_DB_PATH: {{ .Values.config.sqliteDbPath | quote }}
