# Production Helm Chart Values for SynapseMemory
replicaCount: 3

image:
  repository: synapse-memory/gateway
  pullPolicy: IfNotPresent
  tag: "v1.3.1"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: synapse.internal.domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: synapse-tls-cert
      hosts:
        - synapse.internal.domain

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Secrets: Inject from existing Kubernetes secrets or ExternalSecrets operator
# NEVER commit production plaintext credentials to source control.
secrets:
  # Name of an existing Secret containing sensitive credentials
  # Expected keys: SYNAPSE_API_KEY, SYNAPSE_ENCRYPTION_KEY,
  # SYNAPSE_APP_DB_PASSWORD (password for config.dbUser), REDIS_PASSWORD,
  # GEMINI_API_KEY and/or OPENAI_API_KEY. Bootstrap/migration credentials
  # are used only by the operator's provisioning job, not stored in this Secret.
  existingSecret: "synapse-credentials"
  createSecret: false
  # If createSecret is true (e.g. dev/staging testing only):
  geminiApiKey: ""
  openaiApiKey: ""
  encryptionKey: ""
  apiKey: ""
  appDbPassword: ""
  # Deprecated input alias for appDbPassword; this is NOT a PostgreSQL
  # bootstrap/superuser password. Prefer appDbPassword in new values files.
  postgresPassword: ""
  redisPassword: ""

# --- Split workloads: gateway + engine deploy as separate services ---
gateway:
  replicaCount: 2
  image:
    repository: synapse-memory/gateway
    tag: "v1.3.1"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

engine:
  replicaCount: 2
  image:
    repository: synapse-memory/engine
    tag: "v1.3.1"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

config:
  nodeEnv: "production"
  tokenBudgetMax: "1500"
  hybridDecayRate: "0.08"
  dbHost: "synapse-postgresql.default.svc.cluster.local"
  dbPort: "5432"
  # DML-only runtime role, NOT the schema owner (F-04). Provisioned by
  # scripts/provision_db_roles.py; the schema must be migrated ahead of start-up.
  dbUser: "synapse_app"
  dbAdminRole: "synapse_admin"
  dbName: "synapse_cognitive"
  redisHost: "synapse-redis-master.default.svc.cluster.local"
  redisPort: "6379"
  storageBackend: "pgvector"
  # In-cluster engine address. LEAVE EMPTY: the ConfigMap derives it from the
  # release's engine Service name (<fullname>-engine:<pythonPort>) so any
  # `helm install <release>` resolves correctly. Set only to override (e.g.
  # an engine running outside this release).
  pythonEngineUrl: ""
  pythonPort: "8008"
  # REQUIRED in production: the engine refuses the deterministic hash provider.
  # Set to gemini | openai | sentence-transformers and provide the matching key.
  embeddingProvider: "gemini"
  enableDemoRoutes: "false"
  rateLimitPerMin: "120"
  allowedOrigins: "http://localhost:3000"
  sqliteDbPath: "/data/synapse_memory.db"
  # Schema ownership topology (see SECURITY.md "migrate-then-run"):
  #   "false" (DEFAULT, least privilege) migrate-then-run: the migration role
  #           applies the schema ahead of start-up and the engine runs with
  #           config.dbUser set to the DML-only runtime role (synapse_app) from
  #           scripts/provision_db_roles.py — that role cannot execute DDL, so
  #           leaving this "true" would make the engine fail closed at startup.
  #   "true"  single-role dev only: the engine creates/upgrades its own schema,
  #           which requires DATABASE_URL's role to own the schema.
  applyDbSchema: "false"

# --- PostgreSQL: EXTERNAL dependency (deliberately NOT a chart subchart) ---
# This chart does NOT deploy a database and has no `Chart.yaml` dependencies
# on purpose:
#   * the engine requires the pgvector extension (stock Bitnami/PostgreSQL
#     subcharts do not ship it, and their POSTGRESQL_* entrypoint contract
#     does not apply to the pgvector/pgvector image), and
#   * the database lifecycle is owned by the operator: least-privilege roles
#     (scripts/provision_db_roles.py) and migrations must run as a SEPARATE
#     migration role before the engine starts (see SECURITY.md).
# Operator checklist before `helm install`:
#   1. Provision pgvector PostgreSQL (managed service or `pgvector/pgvector`)
#      and point config.dbHost/dbPort/dbUser/dbName at it.
#   2. Create the credentials Secret (secrets.existingSecret) with keys:
#      SYNAPSE_API_KEY, SYNAPSE_ENCRYPTION_KEY, SYNAPSE_APP_DB_PASSWORD,
#      REDIS_PASSWORD (may be empty), GEMINI_API_KEY or OPENAI_API_KEY.
#      Do NOT put bootstrap/superuser or migration-role credentials in the runtime Secret.
#   3. Provision roles, apply schema as the migration role, then set
#      config.applyDbSchema=false and config.dbUser=<runtime-role>.
# `docker-compose` follows the same model: its `postgres-pgvector` service is
# a separate top-level service, not part of the engine/gateway images.
