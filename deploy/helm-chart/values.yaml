# Production Helm Chart Values for SynapseMemory
replicaCount: 3

image:
  repository: synapse-memory/gateway
  pullPolicy: IfNotPresent
  tag: "v1.2.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: synapse.internal.domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: synapse-tls-cert
      hosts:
        - synapse.internal.domain

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Secrets: Inject from existing Kubernetes secrets or ExternalSecrets operator
# NEVER commit production plaintext credentials to source control.
secrets:
  # Name of an existing Secret containing sensitive credentials
  # Expected keys: GEMINI_API_KEY, SYNAPSE_ENCRYPTION_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD
  existingSecret: "synapse-credentials"
  createSecret: false
  # If createSecret is true (e.g. dev/staging testing only):
  geminiApiKey: ""
  encryptionKey: ""
  postgresPassword: ""
  redisPassword: ""

config:
  nodeEnv: "production"
  tokenBudgetMax: "1500"
  hybridDecayRate: "0.08"
  dbHost: "synapse-postgresql.default.svc.cluster.local"
  dbPort: "5432"
  dbUser: "synapse_admin"
  dbName: "synapse_cognitive"
  redisHost: "synapse-redis-master.default.svc.cluster.local"
  redisPort: "6379"

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
  auth:
    username: synapse_admin
    database: synapse_cognitive
    existingSecret: "synapse-credentials"
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""
