# Grafana dashboard provider — auto-loads the Synapse Memory dashboard JSON.
apiVersion: 1

providers:
  - name: "Synapse Memory"
    orgId: 1
    folder: "Synapse Memory"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
