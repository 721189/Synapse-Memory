[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Workspace/tooling manifest — NOT the published distribution. The pip-installable
# SDK is sdk/python (`synapse-memory-engine` on PyPI). Do not upload this root
# project to any package index.
name = "synapse-memory-workspace"
version = "1.2.0"
authors = [
  { name = "Synapse Cognitive Systems", email = "synapse-memory@users.noreply.github.com" },
]
description = "A sovereign, secure, and performant cognitive memory engine for AI agents."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
]
dependencies = [
    "fastapi>=0.95.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.20.0",
    "cryptography>=3.4.0",
    "requests>=2.25.0",
    "numpy>=1.20.0",
]

[project.scripts]
synapse-memory = "synapse_memory.cli.synapse_cli:main"
synapse = "synapse_memory.cli.synapse_cli:main"
synapse-cli = "synapse_memory.cli.synapse_cli:main"

[project.urls]
"Homepage" = "https://github.com/721189/Synapse-Memory"
"Bug Tracker" = "https://github.com/721189/Synapse-Memory/issues"
"Documentation" = "https://github.com/721189/Synapse-Memory#readme"
"Repository" = "https://github.com/721189/Synapse-Memory.git"

[tool.setuptools.packages.find]
where = ["sdk/python"]
